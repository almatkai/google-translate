[package]
name = "tezbar-google-translate"
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "tezbar-google-translate"
path = "src-rust/main.rs"

[dependencies]
serde_json = "=1.0.145"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "aaec571673ab64a85a136cf6bd054ef660c4d93c" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "net"] }

[[test]]
name = "loopback"
path = "tests/loopback.rs"
harness = false
